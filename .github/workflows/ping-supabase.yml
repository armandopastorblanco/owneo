name: Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js --force

      - name: Ping Supabase
        env:
          SUPABASE_URL: https://arctexrzfqfqocghodpp.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyY3RleHJ6ZnFmcW9jZ2hvZHBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODQwNDcsImV4cCI6MjA4OTI2MDA0N30.S6cQxiNu9-x5-s86MAaaUgbR-7dG57EwC987mqjfms4
        run: |
          node -e "
          (async () => {
            try {
              const { createClient } = require('@supabase/supabase-js');
              const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
              const { data, error } = await supabase.from('NOM_DE_TA_TABLE').select('*').limit(1);
              if (error) throw error;
              console.log('✅ Ping Supabase réussi !');
            } catch (err) {
              console.error('❌ Erreur:', err.message);
              process.exit(1);
            }
          })();
          "
